<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector de P&ID - Teste Supabase</title>
    <!-- Tailwind CSS para estilo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para renderização do PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        .marker-dot {
            transform: translate(-50%, -50%);
        }
        .marker-tooltip {
            display: none;
        }
        .marker-wrapper:hover .marker-tooltip {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- CABEÇALHO DA APLICAÇÃO -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <span class="text-xl">⚙️</span>
            <h1 class="text-lg font-bold text-blue-400">Inspector P&ID - Supabase Storage</h1>
        </div>

        <!-- CONTROLES DE PÁGINA E ZOOM -->
        <div class="flex items-center gap-4 bg-gray-800 px-4 py-1.5 rounded-lg border border-gray-700">
            <button onclick="mudarPagina(-1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">◀ Anterior</button>
            <span id="pageInfo" class="text-sm font-semibold text-gray-300">Página: 1 / 1</span>
            <button onclick="mudarPagina(1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">Próxima ▶</button>
            
            <div class="h-4 w-px bg-gray-600 mx-1"></div>

            <button onclick="alterarZoom(0.2)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm font-bold">+</button>
            <span id="zoomInfo" class="text-xs text-gray-400">100%</span>
            <button onclick="alterarZoom(-0.2)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm font-bold">-</button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- VISUALIZADOR DO PDF COM CANVAS E CAMADA DE MARCADORES -->
        <main class="flex-1 overflow-auto p-6 flex justify-center items-start relative bg-gray-950 cursor-crosshair" id="viewerContainer">
            <div id="canvasWrapper" class="relative shadow-2xl border border-gray-800 rounded bg-white">
                <canvas id="pdfCanvas" class="block"></canvas>
                <!-- Camada transparente para os marcadores -->
                <div id="markersLayer" class="absolute inset-0 pointer-events-none"></div>
            </div>
        </main>

        <!-- PAINEL LATERAL DE EDIÇÃO DOS MARCADORES -->
        <aside class="w-96 bg-gray-900 border-l border-gray-800 flex flex-col p-5 overflow-y-auto z-10">
            <h2 class="text-base font-bold text-blue-400 border-b border-gray-800 pb-3 mb-4 flex items-center gap-2">
                <span>📍</span> Instrumento Selecionado
            </h2>

            <div id="formInstruction" class="text-xs text-gray-400 bg-gray-800/60 p-3 rounded border border-gray-700/50 mb-4">
                Clique sobre qualquer instrumento ou local do PDF para posicionar um marcador e preencher suas informações.
            </div>

            <!-- FORMULÁRIO DE PROPRIEDADES -->
            <form id="markerForm" onsubmit="event.preventDefault(); salvarMarcador();" class="space-y-4">
                <input type="hidden" id="markerId">

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">TAG / KKS:</label>
                    <input type="text" id="inputTag" placeholder="Ex: 10LBA10CP010" required 
                           class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Descrição / Função:</label>
                    <input type="text" id="inputDesc" placeholder="Ex: Pressão de Entrada do Vapor" 
                           class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Faixa de Medição (Range):</label>
                    <input type="text" id="inputRange" placeholder="Ex: 0 - 150 bar (g)" 
                           class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Alarmes & Trips:</label>
                    <input type="text" id="inputAlarms" placeholder="Ex: L1: 89 bar | H1: 106.1 bar | H2: 120 bar (Trip)" 
                           class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Comentários & Anotações:</label>
                    <textarea id="inputComments" rows="3" placeholder="Insira aqui observações de comissionamento..." 
                              class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded text-sm transition">
                        Salvar Marcador
                    </button>
                    <button type="button" onclick="excluirMarcador()" class="bg-red-900/40 hover:bg-red-800 border border-red-700 text-red-200 px-4 py-2 rounded text-sm transition">
                        Excluir
                    </button>
                </div>
            </form>

            <hr class="border-gray-800 my-6">

            <!-- LISTA DE MARCADORES DA PÁGINA ATUAL -->
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">
                Marcadores na Página <span id="currentPageNumDisplay">1</span>
            </h3>
            <div id="markersList" class="space-y-2 flex-1 overflow-y-auto">
                <!-- Lista será preenchida via Javascript -->
            </div>
        </aside>
    </div>

    <script>
        // URL do Supabase fornecida
        const pdfUrl = "https://dxjeguzxsitbrpzfzgju.supabase.co/storage/v1/object/public/fluxograma/1.pdf";
        
        let pdfDoc = null;
        let pageNum = 1;
        let scale = 1.2;
        let markers = JSON.parse(localStorage.getItem('supabase_pdf_markers') || '[]');
        let selectedMarkerId = null;
        let pendingCoords = null;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        // Inicializar e carregar o PDF do Supabase
        async function init() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                pdfDoc = await loadingTask.promise;
                renderPage(pageNum);
            } catch (err) {
                console.error("Erro ao carregar o PDF:", err);
                alert("Erro ao carregar o PDF do Supabase Storage. Verifique se o arquivo/bucket está público.");
            }
        }

        // Renderizar página do PDF no Canvas
        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            await page.render(renderContext).promise;

            document.getElementById('pageInfo').textContent = `Página: ${num} / ${pdfDoc.numPages}`;
            document.getElementById('currentPageNumDisplay').textContent = num;
            document.getElementById('zoomInfo').textContent = `${Math.round(scale * 100)}%`;

            renderMarkers();
        }

        function mudarPagina(delta) {
            if (!pdfDoc) return;
            const novaPagina = pageNum + delta;
            if (novaPagina >= 1 && novaPagina <= pdfDoc.numPages) {
                pageNum = novaPagina;
                limparFormulario();
                renderPage(pageNum);
            }
        }

        function alterarZoom(delta) {
            scale = Math.max(0.6, Math.min(3.0, scale + delta));
            renderPage(pageNum);
        }

        // Capturar o clique no Canvas para posicionar um marcador
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / canvas.width;
            const y = (e.clientY - rect.top) / canvas.height;

            pendingCoords = { x, y };
            selectedMarkerId = null;

            document.getElementById('markerId').value = '';
            document.getElementById('inputTag').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputRange').value = '';
            document.getElementById('inputAlarms').value = '';
            document.getElementById('inputComments').value = '';

            document.getElementById('inputTag').focus();
            renderMarkers();
        });

        // Salvar ou atualizar marcador
        function salvarMarcador() {
            const tag = document.getElementById('inputTag').value.trim();
            if (!tag) return alert('Por favor, informe a TAG / KKS do instrumento.');

            const id = document.getElementById('markerId').value || Date.now().toString();
            const desc = document.getElementById('inputDesc').value.trim();
            const range = document.getElementById('inputRange').value.trim();
            const alarms = document.getElementById('inputAlarms').value.trim();
            const comments = document.getElementById('inputComments').value.trim();

            const existingIndex = markers.findIndex(m => m.id === id);

            if (existingIndex >= 0) {
                markers[existingIndex] = { ...markers[existingIndex], tag, desc, range, alarms, comments };
            } else {
                if (!pendingCoords) return alert('Clique primeiro em uma região do PDF para definir a posição do marcador.');
                markers.push({
                    id,
                    page: pageNum,
                    x: pendingCoords.x,
                    y: pendingCoords.y,
                    tag,
                    desc,
                    range,
                    alarms,
                    comments
                });
            }

            localStorage.setItem('supabase_pdf_markers', JSON.stringify(markers));
            selectedMarkerId = id;
            pendingCoords = null;
            renderMarkers();
        }

        // Exibir marcadores na tela e na barra lateral
        function renderMarkers() {
            const layer = document.getElementById('markersLayer');
            layer.innerHTML = '';

            const list = document.getElementById('markersList');
            list.innerHTML = '';

            const pageMarkers = markers.filter(m => m.page === pageNum);

            // Renderizar marca provisória se houver um clique em andamento
            if (pendingCoords && !selectedMarkerId) {
                const tempDot = document.createElement('div');
                tempDot.className = 'absolute marker-dot w-5 h-5 rounded-full bg-yellow-400 border-2 border-black animate-ping pointer-events-none';
                tempDot.style.left = `${pendingCoords.x * 100}%`;
                tempDot.style.top = `${pendingCoords.y * 100}%`;
                layer.appendChild(tempDot);
            }

            pageMarkers.forEach(m => {
                const isSelected = selectedMarkerId === m.id;

                // Elemento do marcador visual sobre o PDF
                const wrapper = document.createElement('div');
                wrapper.className = 'absolute marker-wrapper pointer-events-auto cursor-pointer';
                wrapper.style.left = `${m.x * 100}%`;
                wrapper.style.top = `${m.y * 100}%`;

                const dot = document.createElement('div');
                dot.className = `marker-dot w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-lg transition-transform hover:scale-125 ${
                    isSelected ? 'bg-yellow-400 text-black font-bold ring-4 ring-yellow-300/50' : 'bg-blue-600 text-white'
                }`;
                dot.innerHTML = '📍';

                // Tooltip Flutuante ao passar o mouse
                const tooltip = document.createElement('div');
                tooltip.className = 'marker-tooltip absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-56 bg-gray-900 border border-gray-700 text-gray-100 p-2.5 rounded shadow-xl z-30 pointer-events-none text-xs';
                tooltip.innerHTML = `
                    <div class="font-bold text-blue-400">${m.tag}</div>
                    <div class="text-gray-300 mt-0.5">${m.desc || 'Sem descrição'}</div>
                    ${m.range ? `<div class="text-gray-400 mt-1"><b>Faixa:</b> ${m.range}</div>` : ''}
                    ${m.alarms ? `<div class="text-amber-400 text-[10px] mt-1"><b>Alarmes:</b> ${m.alarms}</div>` : ''}
                `;

                wrapper.appendChild(dot);
                wrapper.appendChild(tooltip);

                wrapper.onclick = (e) => {
                    e.stopPropagation();
                    carregarMarcadorForm(m.id);
                };

                layer.appendChild(wrapper);

                // Elemento do item da Lista na Barra Lateral
                const listItem = document.createElement('div');
                listItem.className = `p-3 rounded-lg border text-sm cursor-pointer transition ${
                    isSelected ? 'bg-gray-800 border-blue-500' : 'bg-gray-800/40 border-gray-800 hover:border-gray-700'
                }`;
                listItem.innerHTML = `
                    <div class="font-bold text-blue-400">${m.tag}</div>
                    <div class="text-xs text-gray-400 truncate mt-0.5">${m.desc || 'Sem descrição'}</div>
                `;
                listItem.onclick = () => carregarMarcadorForm(m.id);
                list.appendChild(listItem);
            });
        }

        function carregarMarcadorForm(id) {
            const m = markers.find(item => item.id === id);
            if (!m) return;

            selectedMarkerId = m.id;
            pendingCoords = null;

            document.getElementById('markerId').value = m.id;
            document.getElementById('inputTag').value = m.tag;
            document.getElementById('inputDesc').value = m.desc || '';
            document.getElementById('inputRange').value = m.range || '';
            document.getElementById('inputAlarms').value = m.alarms || '';
            document.getElementById('inputComments').value = m.comments || '';

            renderMarkers();
        }

        function excluirMarcador() {
            const id = document.getElementById('markerId').value;
            if (!id) return alert('Selecione um marcador para excluir.');

            markers = markers.filter(m => m.id !== id);
            localStorage.setItem('supabase_pdf_markers', JSON.stringify(markers));

            limparFormulario();
            renderMarkers();
        }

        function limparFormulario() {
            selectedMarkerId = null;
            pendingCoords = null;

            document.getElementById('markerId').value = '';
            document.getElementById('inputTag').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputRange').value = '';
            document.getElementById('inputAlarms').value = '';
            document.getElementById('inputComments').value = '';
        }

        // Executar na inicialização da página
        init();
    </script>
</body>
</html>
